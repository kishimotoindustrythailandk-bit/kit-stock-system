name: Build RPP04 Android Printer

on:
  push:
    branches: [main]
    paths:
      - "android-printer/**"
      - ".github/workflows/build-rpp04-printer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-printer
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Stock-KIT-Printer
          path: android-printer/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rpp04-printer-latest --yes --cleanup-tag || true
          gh release create rpp04-printer-latest \
            android-printer/app/build/outputs/apk/debug/app-debug.apk#Control-Stock-KIT-Printer.apk \
            --title "Control Stock KIT Printer" \
            --notes "Android print bridge for Rongta RPP04-E (Bluetooth Classic / ESC)."
